[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-hunting-mvp"
version = "0.1.0"
description = "Human-reviewed freelance opportunity hunting MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
]

[tool.setuptools.packages.find]
include = ["core*", "modules*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["api", "core", "modules"]
strict = true
